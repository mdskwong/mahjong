name: Publish Mahjong Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_mahjong:
    name: Push Mahjong Image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata for Mahjong
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mdskwong/mahjong
          flavor: |
            onlatest=true
          tags: |
            type=raw,value=${{github.sha}},enable=${{github.ref_type != 'tag'}}
            type=raw,value=latest

      - name: Build and push Mahjong Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update_manifest:
    name: Update Compose Tags
    runs-on: ubuntu-latest
    needs: [build_mahjong]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Safely Update Compose Image Mappings
        run: |
          sed -i 's|image: mdskwong/mahjong:.*|image: mdskwong/mahjong:${{ needs.build_mahjong.outputs.version }}|' docker-compose.yml

      - name: Commit and push updated docker-compose.yml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "Update Mahjong image tag (ARM64)" || exit 0
          git push
