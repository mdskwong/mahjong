services:
  mahjong-app:
    image: mdskwong/mahjong:9209625d8d9b816d2aa9dc590c3aba5b2b2b2215
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 1G
    platform: linux/arm64