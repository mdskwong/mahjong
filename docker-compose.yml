services:
  mahjong-app:
    image: mdskwong/mahjong:2c84009acee12b6aee39474693f92f959a0538bc
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 1G
    platform: linux/arm64