services:
  mahjong-app:
    image: mdskwong/mahjong:0018b1749e07332f0c436776d7a83d3d45064ed7
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 1G
    platform: linux/arm64