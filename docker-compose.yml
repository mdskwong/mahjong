services:
  mahjong-app:
    image: mdskwong/mahjong:5c0574f5f03375c2f4cae8032945107e05fe3848
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 1G
    platform: linux/arm64