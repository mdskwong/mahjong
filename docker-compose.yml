services:
  mahjong-app:
    image: mdskwong/mahjong:815ec44e7647b4c9ad28b11232bb1e6f528f00c0
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 1G
    platform: linux/arm64