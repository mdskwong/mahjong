<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HK Mahjong Score Calculator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; color: #e94560; margin-bottom: 24px; font-size: 28px; }
.card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #0f3460; }
.scoreboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 640px) { .scoreboard-grid { grid-template-columns: 1fr 1fr; } }
.card h2 { color: #e94560; font-size: 18px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.tile-grid { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 8px; background: #0f3460; border-radius: 8px; align-items: center; }
.tile { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 44px; border-radius: 6px; cursor: pointer; font-size: 20px; transition: all 0.15s; border: 2px solid transparent; user-select: none; position: relative; }
.tile.bamboo { background: #4a7c59; color: #fff; }
.tile.characters { background: #c0392b; color: #fff; }
.tile.dots { background: #2980b9; color: #fff; }
.tile.wind { background: #8e44ad; color: #fff; }
.tile.dragon { background: #d4ac0d; color: #1a1a2e; }
.tile.selected { border-color: #e94560; transform: scale(1.1); box-shadow: 0 0 12px rgba(233,69,96,0.5); }
.tile .label { position: absolute; bottom: 1px; font-size: 9px; opacity: 0.7; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.form-row label { min-width: 90px; font-size: 14px; }
select, input[type="checkbox"], input[type="text"] { background: #0f3460; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 6px; padding: 6px 10px; outline: none; }
input[type="text"]:focus { border-color: #e94560; }
button { background: #e94560; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
button:hover { background: #d63851; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.suit-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.suit-tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid transparent; background: #0f3460; }
.suit-tab.active { border-color: #e94560; background: #1a2744; }
.value-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.value-btn { width: 36px; height: 36px; border-radius: 6px; cursor: pointer; font-size: 14px; border: 1px solid transparent; background: #0f3460; color: #e0e0e0; transition: all 0.15s; }
.value-btn:hover { border-color: #e94560; }
.value-btn:disabled:hover { border-color: transparent; }
.result { margin-top: 16px; padding: 16px; border-radius: 8px; background: #0f3460; }
.result .fan-header { font-size: 20px; font-weight: bold; color: #e94560; }
.result .score { font-size: 32px; font-weight: bold; color: #2ecc71; }
.result .fan-list { margin-top: 8px; }
.result .fan-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a1a2e; }
.result .fan-item:last-child { border-bottom: none; }
.result .limit-badge { display: inline-block; background: #e94560; color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 12px; margin-left: 8px; }
.error { color: #e74c3c; }
.empty-tiles { color: #555; font-size: 14px; }
.tile-picker { margin-bottom: 16px; }
.meld-list { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 12px; min-height: 60px; padding: 12px; background: #0f3460; border-radius: 8px; align-items: flex-start; }
.meld-item { display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #1a2744; border-radius: 6px; border: 1px solid transparent; transition: border-color 0.15s; }
.meld-item:hover { border-color: #e94560; }
.meld-item-header { display: flex; justify-content: space-between; align-items: center; }
.meld-item-tiles { display: flex; gap: 4px; }
.meld-item button { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #0f3460; }
</style>
</head>
<body>
<div class="container">
  <div style="display: flex; justify-content: flex-end; margin-bottom: -10px; position: relative; z-index: 10;">
    <button id="langToggleBtn" style="font-size:14px; padding:6px 12px; background:#0f3460; border: 1px solid #e94560; color:#fff; border-radius:6px; cursor:pointer; transition:background 0.2s;">中文</button>
  </div>
  <h1 data-i18n="title">🀄 HK Mahjong Score Calculator</h1>

  <div class="card" id="scoreboardCard">
    <h2 style="display:flex; justify-content:space-between; align-items:center;">
      <span data-i18n="scoreboard">Scoreboard</span>
      <div>
        <button id="rotateWindsBtn" data-i18n="rotateWinds" style="font-size:12px; padding:4px 12px; background:#0f3460; border: 1px solid #e94560; margin-right: 8px;">Rotate Winds</button>
        <button id="editPlayersBtn" data-i18n="editNames" style="font-size:12px; padding:4px 12px; background:#0f3460; border: 1px solid #e94560;">Edit Names</button>
      </div>
    </h2>
    <div id="editPlayersForm" style="display:none; margin-bottom: 16px; background: #1a2744; padding: 12px; border-radius: 8px;">
      <div class="grid">
        <div class="form-row"><label data-i18n="east">East</label><input type="text" id="inputNameEast" style="width:100%"></div>
        <div class="form-row"><label data-i18n="south">South</label><input type="text" id="inputNameSouth" style="width:100%"></div>
        <div class="form-row"><label data-i18n="west">West</label><input type="text" id="inputNameWest" style="width:100%"></div>
        <div class="form-row"><label data-i18n="north">North</label><input type="text" id="inputNameNorth" style="width:100%"></div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="savePlayersBtn" data-i18n="savePlayers" style="font-size:13px;padding:6px 16px">Save Players</button>
        <button id="cancelPlayersBtn" data-i18n="cancel" style="font-size:13px;padding:6px 16px; background:#555;">Cancel</button>
      </div>
    </div>
    <div class="scoreboard-grid" id="scoreboardGrid"></div>
  </div>

  <div class="card">
    <h2 data-i18n="settings">Settings</h2>
    <div class="grid">
      <div class="form-row"><label data-i18n="winner">Winner</label><select id="seatWind"></select></div>
      <div class="form-row"><label data-i18n="prevalentWind">Prevalent Wind</label><select id="prevalentWind"></select></div>
      <div class="form-row"><label data-i18n="selfDraw">Self-Draw</label><input type="checkbox" id="selfDraw"></div>
      <div class="form-row" id="discarderRow"><label data-i18n="discarder">Discarder</label><select id="discarderWind"></select></div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="concealedTitle">Concealed Tiles (select your hand)</h2>
    <div class="tile-picker">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <div class="suit-tabs" id="concealedTypeTabs" style="margin-bottom:0;"></div>
      </div>
      <div class="suit-tabs" id="concealedSuitTabs"></div>
      <div class="value-btns" id="concealedValueBtns"></div>
    </div>
    <div class="meld-list" id="concealedList"></div>
    <div style="margin-top:8px"><button id="clearConcealed" data-i18n="clearHand" style="font-size:13px;padding:4px 12px">Clear Hand</button></div>
  </div>

  <div class="card">
    <h2 data-i18n="meldsTitle">Melds (revealed)</h2>
    <div class="tile-picker">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <div class="suit-tabs" id="meldTypeTabs" style="margin-bottom:0;"></div>
        <label style="font-size:13px; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="meldConcealedCb"> <span data-i18n="concealedCb">Concealed</span>
        </label>
      </div>
      <div class="suit-tabs" id="meldSuitTabs"></div>
      <div class="value-btns" id="meldValueBtns"></div>
    </div>
    <div class="meld-list" id="meldList"></div>
    <div style="margin-top:8px"><button id="clearMelds" data-i18n="clearMelds" style="font-size:13px;padding:4px 12px">Clear Melds</button></div>
  </div>

  <button id="calculateBtn" data-i18n="calculateBtn" style="width:100%;padding:14px;font-size:18px">Calculate Score</button>
  <div id="result"></div>
</div>
<script>
const SUIT_CLASS = { bamboo: 'bamboo', characters: 'characters', dots: 'dots', wind: 'wind', dragon: 'dragon' };
const SUIT_SYMBOLS = {
  bamboo: ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'],
  characters: ['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏'],
  dots: ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'],
  wind: ['🀀','🀁','🀂','🀃'],
  dragon: ['🀄','🀅','🀆'],
};
const DRAGON_NAMES = ['','Red','Green','White'];
const WIND_NAMES = ['East','South','West','North'];
const VALUE_SUITS = ['bamboo','characters','dots'];
const ALL_SUITS = ['bamboo','characters','dots','wind','dragon'];

let currentLang = 'en';
const translations = {
  en: {
    title: "🀄 HK Mahjong Score Calculator",
    langToggle: "中文",
    scoreboard: "Scoreboard",
    rotateWinds: "Rotate Winds",
    editNames: "Edit Names",
    east: "East", south: "South", west: "West", north: "North",
    savePlayers: "Save Players", cancel: "Cancel",
    settings: "Settings",
    winner: "Winner", prevalentWind: "Prevalent Wind",
    selfDraw: "Self-Draw", discarder: "Discarder",
    concealedTitle: "Concealed Tiles (select your hand)",
    clearHand: "Clear Hand",
    meldsTitle: "Melds (revealed)",
    concealedCb: "Concealed", clearMelds: "Clear Melds",
    calculateBtn: "Calculate Score", calculating: "Calculating...",
    emptyHand: "Click a tile above to add to your hand",
    emptyMelds: "No melds added yet",
    errorSameWind: "Winner and Discarder cannot be the same wind!",
    applyToScoreboard: "Apply to Scoreboard", scoreApplied: "Score Applied!",
    suitBamboo: "🀐 Bamboo", suitCharacters: "🀇 Characters", suitDots: "🀙 Dots", suitWind: "🀀 Wind", suitDragon: "🀄 Dragon",
    typeSingle: "Single", typePair: "Pair", typePong: "Pong", typeKong: "Kong", typeChow: "Chow",
    concTag: "(Conc)",
    total: "Total", fan: "Fan", points: "points",
    limitHand: "LIMIT HAND", limitBase: "Limit hand (10000 base)",
    base: "Base: 1 point × 2^fan = {0} base",
    dealerMult: " × 2 (dealer) = {0}",
    fanPatterns: "Fan Patterns:",
    commonHand: "Common Hand (0 fan) - base 1 point",
    pattern_Ping_Hu: "Ping Hu (Peace Hand)", pattern_Self_Pick: "Self-Pick",
    pattern_Fully_Concealed: "Fully Concealed Hand", pattern_Dragon_Pong: "Dragon Pong",
    pattern_Value_Wind: "Value Wind Pong", pattern_Mixed_Triple: "Mixed Triple Chow",
    pattern_Half_Flush: "Mixed One Suit (Half Flush)", pattern_All_Pongs: "All Pongs",
    pattern_Double_Dragon: "Double Dragon Pong", pattern_Double_Wind: "Double Value Wind Pong",
    pattern_Outside: "Outside Hand", pattern_Pure_Triple: "Pure Triple Chow",
    pattern_All_Simples: "All Simples", pattern_Three_Concealed: "Three Concealed Pongs",
    pattern_Little_Three: "Little Three Dragons", pattern_Three_Kongs: "Three Kongs",
    pattern_All_Terminals: "All Terminals and Honors", pattern_Big_Three: "Big Three Dragons",
    pattern_Four_Small: "Four Small Winds", pattern_Full_Flush: "Pure One Suit (Full Flush)",
    errNotWinning: "Not a winning hand - cannot form 4 melds + 1 pair",
    errTooFew: "Too few tiles in hand"
  },
  zh: {
    title: "🀄 香港麻雀計番神器",
    langToggle: "English",
    scoreboard: "計分板",
    rotateWinds: "轉風位",
    editNames: "更改名稱",
    east: "東", south: "南", west: "西", north: "北",
    savePlayers: "儲存玩家", cancel: "取消",
    settings: "設定",
    winner: "食糊者", prevalentWind: "圈風",
    selfDraw: "自摸", discarder: "出銃者",
    concealedTitle: "手牌 (選擇你的牌)",
    clearHand: "清空手牌",
    meldsTitle: "鳴牌 (已下的牌)",
    concealedCb: "暗現/暗槓", clearMelds: "清空鳴牌",
    calculateBtn: "計算番數", calculating: "計算中...",
    emptyHand: "點擊上方牌以加入手牌",
    emptyMelds: "尚未加入鳴牌",
    errorSameWind: "食糊者與出銃者不能為同一風位！",
    applyToScoreboard: "應用至計分板", scoreApplied: "已應用！",
    suitBamboo: "🀐 索子", suitCharacters: "🀇 萬子", suitDots: "🀙 筒子", suitWind: "🀀 風牌", suitDragon: "🀄 箭牌",
    typeSingle: "單張", typePair: "眼", typePong: "碰", typeKong: "槓", typeChow: "上",
    concTag: "(暗)",
    total: "總共", fan: "番", points: "分",
    limitHand: "爆棚", limitBase: "爆棚 (10000 底)",
    base: "底分: 1 分 × 2^番數 = {0} 底",
    dealerMult: " × 2 (莊家) = {0}",
    fanPatterns: "番型:",
    commonHand: "雞糊 (0番) - 底 1 分",
    pattern_Ping_Hu: "平糊", pattern_Self_Pick: "自摸",
    pattern_Fully_Concealed: "門前清", pattern_Dragon_Pong: "番牌 (箭牌)",
    pattern_Value_Wind: "番牌 (風牌)", pattern_Mixed_Triple: "三色同順",
    pattern_Half_Flush: "混一色", pattern_All_Pongs: "對對糊",
    pattern_Double_Dragon: "雙箭牌", pattern_Double_Wind: "雙風牌",
    pattern_Outside: "混全帶幺九", pattern_Pure_Triple: "一色三同順",
    pattern_All_Simples: "斷幺九", pattern_Three_Concealed: "三暗刻",
    pattern_Little_Three: "小三元", pattern_Three_Kongs: "三槓",
    pattern_All_Terminals: "混老頭", pattern_Big_Three: "大三元",
    pattern_Four_Small: "小四喜", pattern_Full_Flush: "清一色",
    errNotWinning: "這不是食糊牌型 - 無法組成 4 搭 1 眼",
    errTooFew: "手牌數量不足"
  }
};

function t(key, ...args) {
  let str = translations[currentLang][key] || key;
  args.forEach((arg, i) => str = str.replace(`{${i}}`, arg));
  return str;
}

const backendPatternMap = {
  "Ping Hu (Peace Hand)": "pattern_Ping_Hu",
  "Self-Pick": "pattern_Self_Pick",
  "Fully Concealed Hand": "pattern_Fully_Concealed",
  "Dragon Pong": "pattern_Dragon_Pong",
  "Value Wind Pong": "pattern_Value_Wind",
  "Mixed Triple Chow": "pattern_Mixed_Triple",
  "Mixed One Suit (Half Flush)": "pattern_Half_Flush",
  "All Pongs": "pattern_All_Pongs",
  "Double Dragon Pong": "pattern_Double_Dragon",
  "Double Value Wind Pong": "pattern_Double_Wind",
  "Outside Hand": "pattern_Outside",
  "Pure Triple Chow": "pattern_Pure_Triple",
  "All Simples": "pattern_All_Simples",
  "Three Concealed Pongs": "pattern_Three_Concealed",
  "Little Three Dragons": "pattern_Little_Three",
  "Three Kongs": "pattern_Three_Kongs",
  "All Terminals and Honors": "pattern_All_Terminals",
  "Big Three Dragons": "pattern_Big_Three",
  "Four Small Winds": "pattern_Four_Small",
  "Pure One Suit (Full Flush)": "pattern_Full_Flush"
};

const suitI18nMap = { bamboo: 'suitBamboo', characters: 'suitCharacters', dots: 'suitDots', wind: 'suitWind', dragon: 'suitDragon' };
const typeI18nMap = { single: 'typeSingle', pair: 'typePair', pong: 'typePong', kong: 'typeKong', chow: 'typeChow' };

let concealedTiles = [];
let melds = [];
let selectedConcealedType = 'single';
let selectedConcealedSuit = 'bamboo';
let selectedMeldType = 'pong';
let selectedMeldSuit = 'bamboo';

// 4-Player Score State
let players = {
  east: { name: 'Player East', score: 0 },
  south: { name: 'Player South', score: 0 },
  west: { name: 'Player West', score: 0 },
  north: { name: 'Player North', score: 0 }
};

function getTileCount(suit, value) {
  let count = 0;
  for (const g of concealedTiles) {
    for (const t of g.tiles) {
      if (t.suit === suit && t.value === value) count++;
    }
  }
  for (const m of melds) {
    for (const t of m.tiles) {
      if (t.suit === suit && t.value === value) count++;
    }
  }
  return count;
}

function renderScoreboard() {
  const el = document.getElementById('scoreboardGrid');
  el.innerHTML = Object.entries(players).map(([wind, p]) => `
    <div style="background: #1a2744; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #0f3460;">
      <div style="font-size:12px; color:#aaa; margin-bottom: 4px;">${t(wind)}</div>
      <div style="font-weight:bold; margin-bottom: 4px;">${p.name}</div>
      <div style="color:${p.score >= 0 ? '#2ecc71' : '#e74c3c'}; font-size:24px; font-weight: bold;">${p.score}</div>
    </div>
  `).join('');
}

function tileSymbol(suit, value) {
  const arr = SUIT_SYMBOLS[suit];
  if (!arr) return value;
  return arr[value-1] || value;
}

function tileLabel(suit, value) {
  const sym = tileSymbol(suit, value);
  return suit === 'dragon' ? sym : (suit === 'wind' ? WIND_NAMES[value-1].charAt(0)+WIND_NAMES[value-1].slice(1,2) : sym);
}

const CONCEALED_TYPES = ['single', 'pair', 'pong', 'kong', 'chow'];

function renderConcealedTypeTabs() {
  const el = document.getElementById('concealedTypeTabs');
  el.innerHTML = CONCEALED_TYPES.map(tType => `<div class="suit-tab ${tType === selectedConcealedType ? 'active' : ''}" data-type="${tType}">${t(typeI18nMap[tType])}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedConcealedType = tab.dataset.type; 
      renderConcealedTypeTabs(); 
      renderConcealedSuitTabs(); 
      renderConcealedValueBtns(); 
    });
  });
}

function renderConcealedSuitTabs() {
  const el = document.getElementById('concealedSuitTabs');
  const suits = selectedConcealedType === 'chow' ? VALUE_SUITS : ALL_SUITS;
  if (selectedConcealedType === 'chow' && !VALUE_SUITS.includes(selectedConcealedSuit)) {
    selectedConcealedSuit = 'bamboo';
  }
  el.innerHTML = suits.map(s => `<div class="suit-tab ${s === selectedConcealedSuit ? 'active' : ''}" data-suit="${s}">${t(suitI18nMap[s])}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedConcealedSuit = tab.dataset.suit; 
      renderConcealedSuitTabs(); 
      renderConcealedValueBtns(); 
    });
  });
}

function renderConcealedValueBtns() {
  const el = document.getElementById('concealedValueBtns');
  const suit = selectedConcealedSuit;
  const type = selectedConcealedType;
  
  const currentTotal = concealedTiles.reduce((acc, g) => acc + g.tiles.length, 0);

  const addBtn = (v, label) => {
    let disabled = false;
    let countToAdd = 0;
    if (type === 'single') countToAdd = 1;
    else if (type === 'pair') countToAdd = 2;
    else if (type === 'pong' || type === 'chow') countToAdd = 3;
    else if (type === 'kong') countToAdd = 4;

    if (currentTotal + countToAdd > 14) disabled = true;

    if (!disabled) {
      if (type === 'chow') {
        for (let off = 0; off < 3; off++) {
          if (getTileCount(suit, v + off) + 1 > 4) disabled = true;
        }
      } else {
        if (getTileCount(suit, v) + countToAdd > 4) disabled = true;
      }
    }
    return `<button class="value-btn" data-suit="${suit}" data-value="${v}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  };

  if (suit === 'wind') {
    el.innerHTML = [1,2,3,4].map(v => addBtn(v, SUIT_SYMBOLS.wind[v-1])).join('');
  } else if (suit === 'dragon') {
    el.innerHTML = [1,2,3].map(v => addBtn(v, SUIT_SYMBOLS.dragon[v-1])).join('');
  } else {
    const maxVal = type === 'chow' ? 7 : 9;
    const vals = Array.from({length: maxVal}, (_, i) => i + 1);
    el.innerHTML = vals.map(v => addBtn(v, SUIT_SYMBOLS[suit][v-1])).join('');
  }
  el.querySelectorAll('.value-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!btn.disabled) {
        addConcealedAction(btn.dataset.suit, parseInt(btn.dataset.value));
      }
    });
  });
}

function addConcealedAction(suit, value) {
  const type = selectedConcealedType;
  let toAdd = [];
  if (type === 'single') toAdd.push({suit, value});
  else if (type === 'pair') toAdd.push({suit, value}, {suit, value});
  else if (type === 'pong') toAdd.push({suit, value}, {suit, value}, {suit, value});
  else if (type === 'kong') toAdd.push({suit, value}, {suit, value}, {suit, value}, {suit, value});
  else if (type === 'chow') toAdd.push({suit, value}, {suit, value: value + 1}, {suit, value: value + 2});

  concealedTiles.push({ type: type, tiles: toAdd });
  renderConcealedList();
  renderConcealedValueBtns();
  renderMeldValueBtns();
}

function removeConcealedTile(idx) {
  concealedTiles.splice(idx, 1);
  renderConcealedList();
  renderConcealedValueBtns();
  renderMeldValueBtns();
}

function renderConcealedList() {
  const el = document.getElementById('concealedList');
  if (concealedTiles.length === 0) {
    el.innerHTML = `<span class="empty-tiles">${t('emptyHand')}</span>`;
    return;
  }
  el.innerHTML = concealedTiles.map((g, i) => {
    const tilesHtml = g.tiles.map(t => `<div class="tile ${SUIT_CLASS[t.suit]}">${tileSymbol(t.suit, t.value)}</div>`).join('');
    return `
      <div class="meld-item">
        <div class="meld-item-header">
          <span class="tag" style="text-transform: capitalize;">${t(typeI18nMap[g.type])}</span>
          <button onclick="removeConcealedTile(${i})">✕</button>
        </div>
        <div class="meld-item-tiles">${tilesHtml}</div>
      </div>`;
  }).join('');
}

function renderMeldList() {
  const el = document.getElementById('meldList');
  if (melds.length === 0) {
    el.innerHTML = `<span class="empty-tiles">${t('emptyMelds')}</span>`;
    return;
  }
  el.innerHTML = melds.map((m, i) => {
    const tilesHtml = m.tiles.map(t => `<div class="tile ${SUIT_CLASS[t.suit]}">${tileSymbol(t.suit, t.value)}</div>`).join('');
    return `
      <div class="meld-item">
        <div class="meld-item-header">
          <span class="tag" style="text-transform: capitalize;">${t(typeI18nMap[m.meld_type])} ${m.concealed ? t('concTag') : ''}</span>
          <button onclick="removeMeld(${i})">✕</button>
        </div>
        <div class="meld-item-tiles">${tilesHtml}</div>
      </div>`;
  }).join('');
}

function removeMeld(idx) {
  melds.splice(idx, 1);
  renderMeldList();
  renderMeldValueBtns();
  renderConcealedValueBtns();
}

const MELD_TYPES = ['pong', 'kong', 'chow'];

function renderMeldTypeTabs() {
  const el = document.getElementById('meldTypeTabs');
  el.innerHTML = MELD_TYPES.map(tType => `<div class="suit-tab ${tType === selectedMeldType ? 'active' : ''}" data-type="${tType}">${t(typeI18nMap[tType])}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedMeldType = tab.dataset.type; 
      renderMeldTypeTabs(); 
      renderMeldSuitTabs(); 
      renderMeldValueBtns(); 
    });
  });
}

function renderMeldSuitTabs() {
  const el = document.getElementById('meldSuitTabs');
  const suits = selectedMeldType === 'chow' ? VALUE_SUITS : ALL_SUITS;
  if (selectedMeldType === 'chow' && !VALUE_SUITS.includes(selectedMeldSuit)) {
    selectedMeldSuit = 'bamboo';
  }
  el.innerHTML = suits.map(s => `<div class="suit-tab ${s === selectedMeldSuit ? 'active' : ''}" data-suit="${s}">${t(suitI18nMap[s])}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedMeldSuit = tab.dataset.suit; 
      renderMeldSuitTabs(); 
      renderMeldValueBtns(); 
    });
  });
}

function renderMeldValueBtns() {
  const el = document.getElementById('meldValueBtns');
  const suit = selectedMeldSuit;
  const type = selectedMeldType;
  
  const addBtn = (v, label) => {
    let disabled = false;
    if (type === 'pong' || type === 'kong') {
      const count = type === 'kong' ? 4 : 3;
      if (getTileCount(suit, v) + count > 4) disabled = true;
    } else if (type === 'chow') {
      for (let off = 0; off < 3; off++) {
        if (getTileCount(suit, v + off) + 1 > 4) disabled = true;
      }
    }
    return `<button class="value-btn" data-suit="${suit}" data-value="${v}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  };

  if (suit === 'wind') {
    el.innerHTML = [1,2,3,4].map(v => addBtn(v, SUIT_SYMBOLS.wind[v-1])).join('');
  } else if (suit === 'dragon') {
    el.innerHTML = [1,2,3].map(v => addBtn(v, SUIT_SYMBOLS.dragon[v-1])).join('');
  } else {
    const maxVal = type === 'chow' ? 7 : 9;
    const vals = Array.from({length: maxVal}, (_, i) => i + 1);
    el.innerHTML = vals.map(v => addBtn(v, SUIT_SYMBOLS[suit][v-1])).join('');
  }
  el.querySelectorAll('.value-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!btn.disabled) {
        addMeldAction(btn.dataset.suit, parseInt(btn.dataset.value));
      }
    });
  });
}

function addMeldAction(suit, value) {
  const type = selectedMeldType;
  const concealed = document.getElementById('meldConcealedCb').checked;

  if (type === 'pong' || type === 'kong') {
    const count = type === 'kong' ? 4 : 3;
    if (getTileCount(suit, value) + count > 4) return;
    const tiles = Array(count).fill(null).map(() => ({suit, value}));
    melds.push({ meld_type: type, tiles, concealed });
  } else if (type === 'chow') {
    if (VALUE_SUITS.indexOf(suit) === -1) return;
    if (value > 7) return;
    for (let off = 0; off < 3; off++) {
      if (getTileCount(suit, value + off) + 1 > 4) return;
    }
    const tiles = [0,1,2].map(off => ({suit, value: value + off}));
    melds.push({ meld_type: type, tiles, concealed });
  }
  renderMeldList();
  renderMeldValueBtns();
  renderConcealedValueBtns();
}

document.getElementById('clearMelds').addEventListener('click', () => {
  melds = [];
  renderMeldList();
  renderMeldValueBtns();
  renderConcealedValueBtns();
});

document.getElementById('clearConcealed').addEventListener('click', () => {
  concealedTiles = [];
  renderConcealedList();
  renderConcealedValueBtns();
  renderMeldValueBtns();
});

// Handle Self-Draw toggle
document.getElementById('selfDraw').addEventListener('change', (e) => {
  const discarderRow = document.getElementById('discarderRow');
  const discarderWind = document.getElementById('discarderWind');
  if (e.target.checked) {
    discarderRow.style.opacity = '0.5';
    discarderWind.disabled = true;
  } else {
    discarderRow.style.opacity = '1';
    discarderWind.disabled = false;
  }
});

let calculating = false;
let lastCalculation = null;
document.getElementById('calculateBtn').addEventListener('click', async () => {
  if (calculating) return;
  
  const isSelfDrawn = document.getElementById('selfDraw').checked;
  const seatWind = document.getElementById('seatWind').value;
  const discarderWind = document.getElementById('discarderWind').value;

  if (!isSelfDrawn && seatWind === discarderWind) {
    alert(t('errorSameWind'));
    return;
  }

  calculating = true;
  const btn = document.getElementById('calculateBtn');
  btn.disabled = true;
  btn.textContent = t('calculating');

  try {
    const payload = {
      concealed_tiles: concealedTiles.flatMap(g => g.tiles),
      melds: melds,
      is_self_drawn: isSelfDrawn,
      seat_wind: seatWind,
      prevalent_wind: document.getElementById('prevalentWind').value,
      discarder_wind: isSelfDrawn ? null : discarderWind
    };

    const res = await fetch('/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (!data.error) {
      // Store calculation for later application to scoreboard
      lastCalculation = {
        points: data.total_payable,
        dealer_multiplier: data.dealer_multiplier,
        isSelfDrawn: isSelfDrawn,
        seatWind: seatWind,
        discarderWind: isSelfDrawn ? null : discarderWind
      };
    }
    displayResult(data);
  } catch (e) {
    document.getElementById('result').innerHTML = `<div class="result error">Error: ${e.message}</div>`;
  } finally {
    calculating = false;
    btn.disabled = false;
    btn.textContent = t('calculateBtn');
  }
});

async function applyScore() {
  if (!lastCalculation) return;
  
  // Scores are already updated on the backend when /score happens. 
  // We just fetch the latest synchronized state.
  await fetchState();

  lastCalculation = null; // Prevent applying the same score multiple times
}

let lastResultData = null;
function displayResult(data) {
  lastResultData = data;
  const el = document.getElementById('result');
  if (data.error) {
    let errStr = data.error;
    if (errStr.includes("Not a winning hand")) errStr = t('errNotWinning');
    else if (errStr.includes("Too few tiles")) errStr = t('errTooFew');
    el.innerHTML = `<div class="result error">${errStr}</div>`;
    return;
  }
  const isLimit = data.is_limit;
  el.innerHTML = `
  <div class="result">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <span class="fan-header">${t('total')}: ${data.total_fan} ${t('fan')}</span>
      ${isLimit ? `<span class="limit-badge">${t('limitHand')}</span>` : ''}
    </div>
    <div class="score">${data.total_payable} ${t('points')}</div>
    <div style="font-size:14px;color:#aaa;margin:4px 0 12px">
      ${data.is_limit ? t('limitBase') : t('base', Math.pow(2, data.total_fan))}
      ${data.dealer_multiplier > 1 ? t('dealerMult', data.total_payable) : ''}
    </div>
    ${data.fans && data.fans.length > 0 ? `
    <div class="fan-list">
      <div style="font-size:14px;color:#aaa;margin-bottom:6px">${t('fanPatterns')}</div>
      ${data.fans.map(f => {
        const fName = backendPatternMap[f.name] ? t(backendPatternMap[f.name]) : f.name;
        return `<div class="fan-item"><span>${fName}</span><span>${f.fan} ${t('fan')}</span></div>`;
      }).join('')}
    </div>` : `<div style="color:#aaa;font-size:14px">${t('commonHand')}</div>`}
    <button id="applyScoreBtn" style="margin-top: 16px; width: 100%; padding: 12px; background: #2ecc71; font-size: 16px; color: #fff; border: none; border-radius: 8px; cursor: pointer;">${t('applyToScoreboard')}</button>
  </div>`;
  
  const applyBtn = document.getElementById('applyScoreBtn');
  if (applyBtn) {
    applyBtn.addEventListener('click', () => {
      applyScore();
      applyBtn.disabled = true;
      applyBtn.textContent = t('scoreApplied');
      applyBtn.style.background = '#0f3460';
    });
  }
}

renderConcealedTypeTabs();
renderConcealedSuitTabs();
renderConcealedValueBtns();
renderConcealedList();
renderMeldTypeTabs();
renderMeldSuitTabs();
renderMeldValueBtns();
renderMeldList();

function updateDropdownOptions() {
  const seatWindSelect = document.getElementById('seatWind');
  const discarderWindSelect = document.getElementById('discarderWind');
  const prevalentWindSelect = document.getElementById('prevalentWind');
  
  const seatVal = seatWindSelect.value || 'east';
  const discarderVal = discarderWindSelect.value || 'east';
  const prevalentVal = prevalentWindSelect.value || 'east';
  
  seatWindSelect.innerHTML = '';
  discarderWindSelect.innerHTML = '';
  prevalentWindSelect.innerHTML = '';
  
  ['east', 'south', 'west', 'north'].forEach(w => {
    const wName = t(w);
    prevalentWindSelect.innerHTML += `<option value="${w}">${wName}</option>`;
    
    const p = players[w];
    if (p) {
      const text = `${p.name} (${wName})`;
      seatWindSelect.innerHTML += `<option value="${w}">${text}</option>`;
      discarderWindSelect.innerHTML += `<option value="${w}">${text}</option>`;
    }
  });
  
  seatWindSelect.value = seatVal;
  discarderWindSelect.value = discarderVal;
  prevalentWindSelect.value = prevalentVal;
}

async function fetchState() {
  try {
    const res = await fetch('/state');
    if (res.ok) {
      const data = await res.json();
      data.players.forEach(p => {
        if (players[p.seat_wind]) {
          players[p.seat_wind].name = p.name;
          players[p.seat_wind].score = p.score;
        }
      });
      if (data.prevalent_wind) {
        document.getElementById('prevalentWind').value = data.prevalent_wind;
      }
      updateDropdownOptions();
      renderScoreboard();
    }
  } catch (e) {
    console.error('Could not fetch state', e);
    updateDropdownOptions();
    renderScoreboard(); // Fallback to local hardcoded objects
  }
}

document.getElementById('editPlayersBtn').addEventListener('click', () => {
  document.getElementById('inputNameEast').value = players.east.name;
  document.getElementById('inputNameSouth').value = players.south.name;
  document.getElementById('inputNameWest').value = players.west.name;
  document.getElementById('inputNameNorth').value = players.north.name;
  document.getElementById('editPlayersForm').style.display = 'block';
  document.getElementById('scoreboardGrid').style.display = 'none';
});

document.getElementById('cancelPlayersBtn').addEventListener('click', () => {
  document.getElementById('editPlayersForm').style.display = 'none';
  document.getElementById('scoreboardGrid').style.display = 'grid';
});

document.getElementById('savePlayersBtn').addEventListener('click', async () => {
  const payload = {
    east: document.getElementById('inputNameEast').value,
    south: document.getElementById('inputNameSouth').value,
    west: document.getElementById('inputNameWest').value,
    north: document.getElementById('inputNameNorth').value
  };
  try {
    await fetch('/players', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    await fetchState();
    document.getElementById('editPlayersForm').style.display = 'none';
    document.getElementById('scoreboardGrid').style.display = 'grid';
  } catch (e) {
    console.error('Failed to save players', e);
  }
});

document.getElementById('rotateWindsBtn').addEventListener('click', async () => {
  try {
    await fetch('/rotate-winds', { method: 'POST' });
    await fetchState(); // Instantly update frontend UI
  } catch (e) {
    console.error('Failed to rotate winds', e);
  }
});

// Initialize everything from the backend!
fetchState();

document.getElementById('langToggleBtn').addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'zh' : 'en';
  document.getElementById('langToggleBtn').textContent = t('langToggle');
  
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  
  updateDropdownOptions();
  renderScoreboard();
  renderConcealedTypeTabs();
  renderConcealedSuitTabs();
  renderConcealedList();
  renderMeldTypeTabs();
  renderMeldSuitTabs();
  renderMeldList();
  
  if (calculating) document.getElementById('calculateBtn').textContent = t('calculating');
  if (lastResultData) displayResult(lastResultData);
});

document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
</script>
