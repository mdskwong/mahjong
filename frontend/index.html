<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HK Mahjong Score Calculator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; color: #e94560; margin-bottom: 24px; font-size: 28px; }
.card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #0f3460; }
.scoreboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 640px) { .scoreboard-grid { grid-template-columns: 1fr 1fr; } }
.card h2 { color: #e94560; font-size: 18px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.tile-grid { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 8px; background: #0f3460; border-radius: 8px; align-items: center; }
.tile { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 44px; border-radius: 6px; cursor: pointer; font-size: 20px; transition: all 0.15s; border: 2px solid transparent; user-select: none; position: relative; }
.tile.bamboo { background: #4a7c59; color: #fff; }
.tile.characters { background: #c0392b; color: #fff; }
.tile.dots { background: #2980b9; color: #fff; }
.tile.wind { background: #8e44ad; color: #fff; }
.tile.dragon { background: #d4ac0d; color: #1a1a2e; }
.tile.selected { border-color: #e94560; transform: scale(1.1); box-shadow: 0 0 12px rgba(233,69,96,0.5); }
.tile .label { position: absolute; bottom: 1px; font-size: 9px; opacity: 0.7; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.form-row label { min-width: 90px; font-size: 14px; }
select, input[type="checkbox"], input[type="text"] { background: #0f3460; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 6px; padding: 6px 10px; outline: none; }
input[type="text"]:focus { border-color: #e94560; }
button { background: #e94560; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
button:hover { background: #d63851; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.suit-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.suit-tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid transparent; background: #0f3460; }
.suit-tab.active { border-color: #e94560; background: #1a2744; }
.value-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.value-btn { width: 36px; height: 36px; border-radius: 6px; cursor: pointer; font-size: 14px; border: 1px solid transparent; background: #0f3460; color: #e0e0e0; transition: all 0.15s; }
.value-btn:hover { border-color: #e94560; }
.value-btn:disabled:hover { border-color: transparent; }
.result { margin-top: 16px; padding: 16px; border-radius: 8px; background: #0f3460; }
.result .fan-header { font-size: 20px; font-weight: bold; color: #e94560; }
.result .score { font-size: 32px; font-weight: bold; color: #2ecc71; }
.result .fan-list { margin-top: 8px; }
.result .fan-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a1a2e; }
.result .fan-item:last-child { border-bottom: none; }
.result .limit-badge { display: inline-block; background: #e94560; color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 12px; margin-left: 8px; }
.error { color: #e74c3c; }
.empty-tiles { color: #555; font-size: 14px; }
.tile-picker { margin-bottom: 16px; }
.meld-list { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 12px; min-height: 60px; padding: 12px; background: #0f3460; border-radius: 8px; align-items: flex-start; }
.meld-item { display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #1a2744; border-radius: 6px; border: 1px solid transparent; transition: border-color 0.15s; }
.meld-item:hover { border-color: #e94560; }
.meld-item-header { display: flex; justify-content: space-between; align-items: center; }
.meld-item-tiles { display: flex; gap: 4px; }
.meld-item button { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #0f3460; }
</style>
</head>
<body>
<div class="container">
  <h1>🀄 HK Mahjong Score Calculator</h1>

  <div class="card" id="scoreboardCard">
    <h2 style="display:flex; justify-content:space-between; align-items:center;">
      Scoreboard
      <div>
        <button id="rotateWindsBtn" style="font-size:12px; padding:4px 12px; background:#0f3460; border: 1px solid #e94560; margin-right: 8px;">Rotate Winds</button>
        <button id="editPlayersBtn" style="font-size:12px; padding:4px 12px; background:#0f3460; border: 1px solid #e94560;">Edit Names</button>
      </div>
    </h2>
    <div id="editPlayersForm" style="display:none; margin-bottom: 16px; background: #1a2744; padding: 12px; border-radius: 8px;">
      <div class="grid">
        <div class="form-row"><label>East</label><input type="text" id="inputNameEast" style="width:100%"></div>
        <div class="form-row"><label>South</label><input type="text" id="inputNameSouth" style="width:100%"></div>
        <div class="form-row"><label>West</label><input type="text" id="inputNameWest" style="width:100%"></div>
        <div class="form-row"><label>North</label><input type="text" id="inputNameNorth" style="width:100%"></div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="savePlayersBtn" style="font-size:13px;padding:6px 16px">Save Players</button>
        <button id="cancelPlayersBtn" style="font-size:13px;padding:6px 16px; background:#555;">Cancel</button>
      </div>
    </div>
    <div class="scoreboard-grid" id="scoreboardGrid"></div>
  </div>

  <div class="card">
    <h2>Settings</h2>
    <div class="grid">
      <div class="form-row"><label>Winner</label><select id="seatWind"><option value="east">East</option><option value="south">South</option><option value="west">West</option><option value="north">North</option></select></div>
      <div class="form-row"><label>Prevalent Wind</label><select id="prevalentWind"><option value="east">East</option><option value="south">South</option><option value="west">West</option><option value="north">North</option></select></div>
      <div class="form-row"><label>Self-Draw</label><input type="checkbox" id="selfDraw"></div>
      <div class="form-row" id="discarderRow"><label>Discarder</label><select id="discarderWind"><option value="east">East</option><option value="south">South</option><option value="west">West</option><option value="north">North</option></select></div>
    </div>
  </div>

  <div class="card">
    <h2>Concealed Tiles (select your hand)</h2>
    <div class="tile-picker">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <div class="suit-tabs" id="concealedTypeTabs" style="margin-bottom:0;"></div>
      </div>
      <div class="suit-tabs" id="suitTabs"></div>
      <div class="value-btns" id="valueBtns"></div>
    </div>
    <div class="tile-grid" id="concealedTiles"></div>
    <div style="margin-top:8px"><button id="clearHand" style="font-size:13px;padding:4px 12px">Clear Hand</button></div>
  </div>

  <div class="card">
    <h2>Melds (revealed)</h2>
    <div class="tile-picker">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <div class="suit-tabs" id="meldTypeTabs" style="margin-bottom:0;"></div>
        <label style="font-size:13px; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="meldConcealedCb"> Concealed
        </label>
      </div>
      <div class="suit-tabs" id="meldSuitTabs"></div>
      <div class="value-btns" id="meldValueBtns"></div>
    </div>
    <div class="meld-list" id="meldList"></div>
    <div style="margin-top:8px"><button id="clearMelds" style="font-size:13px;padding:4px 12px">Clear Melds</button></div>
  </div>

  <button id="calculateBtn" style="width:100%;padding:14px;font-size:18px">Calculate Score</button>
  <div id="result"></div>
</div>
<script>
const SUIT_LABELS = { bamboo: '🀐 Bamboo', characters: '🀇 Characters', dots: '🀙 Dots', wind: '🀀 Wind', dragon: '🀄 Dragon' };
const SUIT_CLASS = { bamboo: 'bamboo', characters: 'characters', dots: 'dots', wind: 'wind', dragon: 'dragon' };
const SUIT_SYMBOLS = {
  bamboo: ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'],
  characters: ['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏'],
  dots: ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'],
  wind: ['🀀','🀁','🀂','🀃'],
  dragon: [' ','🀄','🀅','🀆'],
};
const DRAGON_NAMES = ['','Red','Green','White'];
const WIND_NAMES = ['East','South','West','North'];
const VALUE_SUITS = ['bamboo','characters','dots'];
const ALL_SUITS = ['bamboo','characters','dots','wind','dragon'];

let concealedTiles = [];
let melds = [];
let selectedSuit = 'bamboo';
let selectedConcealedType = 'single';
let selectedMeldType = 'pong';
let selectedMeldSuit = 'bamboo';

// 4-Player Score State
let players = {
  east: { name: 'Player East', score: 0 },
  south: { name: 'Player South', score: 0 },
  west: { name: 'Player West', score: 0 },
  north: { name: 'Player North', score: 0 }
};

function getTileCount(suit, value) {
  let count = 0;
  for (const t of concealedTiles) {
    if (t.suit === suit && t.value === value) count++;
  }
  for (const m of melds) {
    for (const t of m.tiles) {
      if (t.suit === suit && t.value === value) count++;
    }
  }
  return count;
}

function renderScoreboard() {
  const el = document.getElementById('scoreboardGrid');
  el.innerHTML = Object.entries(players).map(([wind, p]) => `
    <div style="background: #1a2744; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #0f3460;">
      <div style="font-size:12px; color:#aaa; text-transform:uppercase; margin-bottom: 4px;">${wind}</div>
      <div style="font-weight:bold; margin-bottom: 4px;">${p.name}</div>
      <div style="color:${p.score >= 0 ? '#2ecc71' : '#e74c3c'}; font-size:24px; font-weight: bold;">${p.score}</div>
    </div>
  `).join('');
}

const CONCEALED_TYPES = ['single', 'pair', 'pong', 'kong', 'chow'];
const CONCEALED_TYPE_LABELS = { single: 'Single', pair: 'Pair', pong: 'Pong', kong: 'Kong', chow: 'Chow' };

function renderConcealedTypeTabs() {
  const el = document.getElementById('concealedTypeTabs');
  el.innerHTML = CONCEALED_TYPES.map(t => `<div class="suit-tab ${t === selectedConcealedType ? 'active' : ''}" data-type="${t}">${CONCEALED_TYPE_LABELS[t]}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedConcealedType = tab.dataset.type; 
      renderConcealedTypeTabs(); 
      renderSuitTabs(); 
      renderValueBtns(); 
    });
  });
}

function renderSuitTabs() {
  const el = document.getElementById('suitTabs');
  const suits = selectedConcealedType === 'chow' ? VALUE_SUITS : ALL_SUITS;
  if (selectedConcealedType === 'chow' && !VALUE_SUITS.includes(selectedSuit)) {
    selectedSuit = 'bamboo';
  }
  el.innerHTML = suits.map(s => `<div class="suit-tab ${s === selectedSuit ? 'active' : ''}" data-suit="${s}">${SUIT_LABELS[s]}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedSuit = tab.dataset.suit; 
      renderSuitTabs(); 
      renderValueBtns(); 
    });
  });
}

function renderValueBtns() {
  const el = document.getElementById('valueBtns');
  const suit = selectedSuit;
  const type = selectedConcealedType;
  
  const addBtn = (v, label) => {
    let disabled = false;
    if (type === 'single') {
      if (getTileCount(suit, v) + 1 > 4) disabled = true;
      if (concealedTiles.length + 1 > 14) disabled = true;
    } else if (type === 'pair') {
      if (getTileCount(suit, v) + 2 > 4) disabled = true;
      if (concealedTiles.length + 2 > 14) disabled = true;
    } else if (type === 'pong') {
      if (getTileCount(suit, v) + 3 > 4) disabled = true;
      if (concealedTiles.length + 3 > 14) disabled = true;
    } else if (type === 'kong') {
      if (getTileCount(suit, v) + 4 > 4) disabled = true;
      if (concealedTiles.length + 4 > 14) disabled = true;
    } else if (type === 'chow') {
      for (let off = 0; off < 3; off++) {
        if (getTileCount(suit, v + off) + 1 > 4) disabled = true;
      }
      if (concealedTiles.length + 3 > 14) disabled = true;
    }
    return `<button class="value-btn" data-suit="${suit}" data-value="${v}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  };

  if (suit === 'wind') {
    el.innerHTML = [1,2,3,4].map(v => addBtn(v, WIND_NAMES[v-1])).join('');
  } else if (suit === 'dragon') {
    el.innerHTML = [1,2,3].map(v => addBtn(v, DRAGON_NAMES[v])).join('');
  } else {
    const maxVal = type === 'chow' ? 7 : 9;
    const vals = Array.from({length: maxVal}, (_, i) => i + 1);
    el.innerHTML = vals.map(v => addBtn(v, v)).join('');
  }
  el.querySelectorAll('.value-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!btn.disabled) {
        addTile(btn.dataset.suit, parseInt(btn.dataset.value));
      }
    });
  });
}

function tileSymbol(suit, value) {
  const arr = SUIT_SYMBOLS[suit];
  if (!arr) return value;
  if (suit === 'dragon') return DRAGON_NAMES[value] || '?';
  return arr[value-1] || value;
}

function tileLabel(suit, value) {
  const sym = tileSymbol(suit, value);
  return suit === 'dragon' ? sym.charAt(0) : (suit === 'wind' ? WIND_NAMES[value-1].charAt(0)+WIND_NAMES[value-1].slice(1,2) : sym);
}

function addTile(suit, value) {
  const type = selectedConcealedType;
  let toAdd = [];
  if (type === 'single') toAdd.push({suit, value});
  else if (type === 'pair') toAdd.push({suit, value}, {suit, value});
  else if (type === 'pong') toAdd.push({suit, value}, {suit, value}, {suit, value});
  else if (type === 'kong') toAdd.push({suit, value}, {suit, value}, {suit, value}, {suit, value});
  else if (type === 'chow') toAdd.push({suit, value}, {suit, value: value + 1}, {suit, value: value + 2});

  if (concealedTiles.length + toAdd.length > 14) return;
  concealedTiles.push(...toAdd);
  renderConcealedTiles();
  renderValueBtns();
  renderMeldValueBtns();
}

function removeTile(idx) {
  concealedTiles.splice(idx, 1);
  renderConcealedTiles();
  renderValueBtns();
  renderMeldValueBtns();
}

function renderConcealedTiles() {
  const el = document.getElementById('concealedTiles');
  if (concealedTiles.length === 0) {
    el.innerHTML = '<span class="empty-tiles">Click a tile above to add to your hand</span>';
    return;
  }
  el.innerHTML = concealedTiles.map((t, i) =>
    `<div class="tile ${SUIT_CLASS[t.suit]}" onclick="removeTile(${i})">${tileSymbol(t.suit, t.value)}<span class="label">x</span></div>`
  ).join('');
}

function renderMeldList() {
  const el = document.getElementById('meldList');
  if (melds.length === 0) {
    el.innerHTML = '<span class="empty-tiles">No melds added yet</span>';
    return;
  }
  el.innerHTML = melds.map((m, i) => {
    const tilesHtml = m.tiles.map(t => `<div class="tile ${SUIT_CLASS[t.suit]}">${tileSymbol(t.suit, t.value)}</div>`).join('');
    return `
      <div class="meld-item">
        <div class="meld-item-header">
          <span class="tag" style="text-transform: capitalize;">${m.meld_type} ${m.concealed ? '(Conc)' : ''}</span>
          <button onclick="removeMeld(${i})">✕</button>
        </div>
        <div class="meld-item-tiles">${tilesHtml}</div>
      </div>`;
  }).join('');
}

function removeMeld(idx) {
  melds.splice(idx, 1);
  renderMeldList();
  renderValueBtns();
  renderMeldValueBtns();
}

const MELD_TYPES = ['pong', 'kong', 'chow'];
const MELD_TYPE_LABELS = { pong: 'Pong', kong: 'Kong', chow: 'Chow' };

function renderMeldTypeTabs() {
  const el = document.getElementById('meldTypeTabs');
  el.innerHTML = MELD_TYPES.map(t => `<div class="suit-tab ${t === selectedMeldType ? 'active' : ''}" data-type="${t}">${MELD_TYPE_LABELS[t]}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedMeldType = tab.dataset.type; 
      renderMeldTypeTabs(); 
      renderMeldSuitTabs(); 
      renderMeldValueBtns(); 
    });
  });
}

function renderMeldSuitTabs() {
  const el = document.getElementById('meldSuitTabs');
  const suits = selectedMeldType === 'chow' ? VALUE_SUITS : ALL_SUITS;
  if (selectedMeldType === 'chow' && !VALUE_SUITS.includes(selectedMeldSuit)) {
    selectedMeldSuit = 'bamboo';
  }
  el.innerHTML = suits.map(s => `<div class="suit-tab ${s === selectedMeldSuit ? 'active' : ''}" data-suit="${s}">${SUIT_LABELS[s]}</div>`).join('');
  el.querySelectorAll('.suit-tab').forEach(tab => {
    tab.addEventListener('click', () => { 
      selectedMeldSuit = tab.dataset.suit; 
      renderMeldSuitTabs(); 
      renderMeldValueBtns(); 
    });
  });
}

function renderMeldValueBtns() {
  const el = document.getElementById('meldValueBtns');
  const suit = selectedMeldSuit;
  const type = selectedMeldType;
  
  const addBtn = (v, label) => {
    let disabled = false;
    if (type === 'pong' || type === 'kong') {
      const count = type === 'kong' ? 4 : 3;
      if (getTileCount(suit, v) + count > 4) disabled = true;
    } else if (type === 'chow') {
      for (let off = 0; off < 3; off++) {
        if (getTileCount(suit, v + off) + 1 > 4) disabled = true;
      }
    }
    return `<button class="value-btn" data-suit="${suit}" data-value="${v}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  };

  if (suit === 'wind') {
    el.innerHTML = [1,2,3,4].map(v => addBtn(v, WIND_NAMES[v-1])).join('');
  } else if (suit === 'dragon') {
    el.innerHTML = [1,2,3].map(v => addBtn(v, DRAGON_NAMES[v])).join('');
  } else {
    const maxVal = type === 'chow' ? 7 : 9;
    const vals = Array.from({length: maxVal}, (_, i) => i + 1);
    el.innerHTML = vals.map(v => addBtn(v, v)).join('');
  }
  el.querySelectorAll('.value-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!btn.disabled) {
        addMeldAction(btn.dataset.suit, parseInt(btn.dataset.value));
      }
    });
  });
}

function addMeldAction(suit, value) {
  const type = selectedMeldType;
  const concealed = document.getElementById('meldConcealedCb').checked;

  if (type === 'pong' || type === 'kong') {
    const count = type === 'kong' ? 4 : 3;
    if (getTileCount(suit, value) + count > 4) return;
    const tiles = Array(count).fill(null).map(() => ({suit, value}));
    melds.push({ meld_type: type, tiles, concealed });
  } else if (type === 'chow') {
    if (VALUE_SUITS.indexOf(suit) === -1) return;
    if (value > 7) return;
    for (let off = 0; off < 3; off++) {
      if (getTileCount(suit, value + off) + 1 > 4) return;
    }
    const tiles = [0,1,2].map(off => ({suit, value: value + off}));
    melds.push({ meld_type: type, tiles, concealed });
  }
  renderMeldList();
  renderValueBtns();
  renderMeldValueBtns();
}

document.getElementById('clearHand').addEventListener('click', () => {
  concealedTiles = [];
  renderConcealedTiles();
  renderValueBtns();
  renderMeldValueBtns();
});

document.getElementById('clearMelds').addEventListener('click', () => {
  melds = [];
  renderMeldList();
  renderValueBtns();
  renderMeldValueBtns();
});

// Handle Self-Draw toggle
document.getElementById('selfDraw').addEventListener('change', (e) => {
  const discarderRow = document.getElementById('discarderRow');
  const discarderWind = document.getElementById('discarderWind');
  if (e.target.checked) {
    discarderRow.style.opacity = '0.5';
    discarderWind.disabled = true;
  } else {
    discarderRow.style.opacity = '1';
    discarderWind.disabled = false;
  }
});

let calculating = false;
let lastCalculation = null;
document.getElementById('calculateBtn').addEventListener('click', async () => {
  if (calculating) return;
  
  const isSelfDrawn = document.getElementById('selfDraw').checked;
  const seatWind = document.getElementById('seatWind').value;
  const discarderWind = document.getElementById('discarderWind').value;

  if (!isSelfDrawn && seatWind === discarderWind) {
    alert("Winner and Discarder cannot be the same wind!");
    return;
  }

  calculating = true;
  const btn = document.getElementById('calculateBtn');
  btn.disabled = true;
  btn.textContent = 'Calculating...';

  try {
    const payload = {
      concealed_tiles: concealedTiles,
      melds: melds,
      is_self_drawn: isSelfDrawn,
      seat_wind: seatWind,
      prevalent_wind: document.getElementById('prevalentWind').value,
      discarder_wind: isSelfDrawn ? null : discarderWind
    };

    const res = await fetch('/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (!data.error) {
      // Store calculation for later application to scoreboard
      lastCalculation = {
        points: data.total_payable,
        dealer_multiplier: data.dealer_multiplier,
        isSelfDrawn: isSelfDrawn,
        seatWind: seatWind,
        discarderWind: isSelfDrawn ? null : discarderWind
      };
    }
    displayResult(data);
  } catch (e) {
    document.getElementById('result').innerHTML = `<div class="result error">Error: ${e.message}</div>`;
  } finally {
    calculating = false;
    btn.disabled = false;
    btn.textContent = 'Calculate Score';
  }
});

async function applyScore() {
  if (!lastCalculation) return;
  
  // Scores are already updated on the backend when /score happens. 
  // We just fetch the latest synchronized state.
  await fetchState();

  lastCalculation = null; // Prevent applying the same score multiple times
}

function displayResult(data) {
  const el = document.getElementById('result');
  if (data.error) {
    el.innerHTML = `<div class="result error">${data.error}</div>`;
    return;
  }
  const isLimit = data.is_limit;
  el.innerHTML = `
  <div class="result">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <span class="fan-header">Total: ${data.total_fan} Fan</span>
      ${isLimit ? '<span class="limit-badge">LIMIT HAND</span>' : ''}
    </div>
    <div class="score">${data.total_payable} points</div>
    <div style="font-size:14px;color:#aaa;margin:4px 0 12px">
      ${data.is_limit ? 'Limit hand (10000 base)' : 'Base: 1 point × 2^fan = ' + Math.pow(2, data.total_fan) + ' base'}
      ${data.dealer_multiplier > 1 ? ' × 2 (dealer) = ' + data.total_payable : ''}
    </div>
    ${data.fans && data.fans.length > 0 ? `
    <div class="fan-list">
      <div style="font-size:14px;color:#aaa;margin-bottom:6px">Fan Patterns:</div>
      ${data.fans.map(f => `<div class="fan-item"><span>${f.name}</span><span>${f.fan} fan</span></div>`).join('')}
    </div>` : '<div style="color:#aaa;font-size:14px">Common Hand (0 fan) - base 1 point</div>'}
    <button id="applyScoreBtn" style="margin-top: 16px; width: 100%; padding: 12px; background: #2ecc71; font-size: 16px; color: #fff; border: none; border-radius: 8px; cursor: pointer;">Apply to Scoreboard</button>
  </div>`;
  
  const applyBtn = document.getElementById('applyScoreBtn');
  if (applyBtn) {
    applyBtn.addEventListener('click', () => {
      applyScore();
      applyBtn.disabled = true;
      applyBtn.textContent = 'Score Applied!';
      applyBtn.style.background = '#0f3460';
    });
  }
}

async function fetchState() {
  try {
    const res = await fetch('/state');
    if (res.ok) {
      const data = await res.json();
      data.players.forEach(p => {
        if (players[p.seat_wind]) {
          players[p.seat_wind].name = p.name;
          players[p.seat_wind].score = p.score;
        }
      });
      if (data.prevalent_wind) {
        document.getElementById('prevalentWind').value = data.prevalent_wind;
      }

      // Dynamically populate Winner and Discarder dropdowns with Player Names
      const seatWindSelect = document.getElementById('seatWind');
      const discarderWindSelect = document.getElementById('discarderWind');
      const currentSeat = seatWindSelect.value;
      const currentDiscarder = discarderWindSelect.value;
      
      seatWindSelect.innerHTML = '';
      discarderWindSelect.innerHTML = '';
      
      ['east', 'south', 'west', 'north'].forEach(w => {
        const p = players[w];
        if (p) {
          const text = `${p.name} (${w.charAt(0).toUpperCase() + w.slice(1)})`;
          seatWindSelect.innerHTML += `<option value="${w}">${text}</option>`;
          discarderWindSelect.innerHTML += `<option value="${w}">${text}</option>`;
        }
      });
      
      if (currentSeat) seatWindSelect.value = currentSeat;
      if (currentDiscarder) discarderWindSelect.value = currentDiscarder;

      renderScoreboard();
    }
  } catch (e) {
    console.error('Could not fetch state', e);
    renderScoreboard(); // Fallback to local hardcoded objects
  }
}

document.getElementById('editPlayersBtn').addEventListener('click', () => {
  document.getElementById('inputNameEast').value = players.east.name;
  document.getElementById('inputNameSouth').value = players.south.name;
  document.getElementById('inputNameWest').value = players.west.name;
  document.getElementById('inputNameNorth').value = players.north.name;
  document.getElementById('editPlayersForm').style.display = 'block';
  document.getElementById('scoreboardGrid').style.display = 'none';
});

document.getElementById('cancelPlayersBtn').addEventListener('click', () => {
  document.getElementById('editPlayersForm').style.display = 'none';
  document.getElementById('scoreboardGrid').style.display = 'grid';
});

document.getElementById('savePlayersBtn').addEventListener('click', async () => {
  const payload = {
    east: document.getElementById('inputNameEast').value,
    south: document.getElementById('inputNameSouth').value,
    west: document.getElementById('inputNameWest').value,
    north: document.getElementById('inputNameNorth').value
  };
  try {
    await fetch('/players', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    await fetchState();
    document.getElementById('editPlayersForm').style.display = 'none';
    document.getElementById('scoreboardGrid').style.display = 'grid';
  } catch (e) {
    console.error('Failed to save players', e);
  }
});

document.getElementById('rotateWindsBtn').addEventListener('click', async () => {
  try {
    await fetch('/rotate-winds', { method: 'POST' });
    await fetchState(); // Instantly update frontend UI
  } catch (e) {
    console.error('Failed to rotate winds', e);
  }
});

// Initialize everything from the backend!
fetchState();
